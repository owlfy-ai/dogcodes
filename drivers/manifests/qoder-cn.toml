schema_version = 1
id = "qoder-cn"
display_name = "Qoder CN"
homepage = "https://qoder.com.cn/"
runtime_kind = "external_process"

# The desktop app ships the full qoderclicn runtime as a Node script and runs it
# through its own Electron binary in node mode; no system Node.js is needed.
# The CLI keeps its own login under ~/.qoder-cn: signing in to the desktop app
# does not sign in the CLI, so readiness reports NotConfigured until
# `qoderclicn login` has run once.
[discovery]
candidate_executables = ["Qoder CN"]
bundled_script = "app.asar.unpacked/node_modules/@qoder-ai/qoder-cn-agent-sdk/dist/_worker/qoder-worker-runtime.obf.mjs"
# `--version` prints a bare `1.1.86-hotfix.19`; the help banner names the
# CN edition, which also tells it apart from the international runtime.
version_args = ["--version"]
identity_args = ["--help"]
version_output_markers = ["Qoder CLI CN"]
env_allowlist = ["PATH"]
# A cold start loads a 36 MB script through Electron.
timeout_millis = 10000
output_limit_bytes = 65536
launch_args = ["--acp"]

[discovery.env_overrides]
ELECTRON_RUN_AS_NODE = "1"

[discovery.platform_paths]
# Not yet verified on a real macOS install; Windows is found through the
# desktop install directory instead (agent-registry windows.rs).
macos = ["/Applications/Qoder CN.app/Contents/MacOS/Qoder CN"]
windows = []
linux = []

[discovery.user_paths]
macos = ["Applications/Qoder CN.app/Contents/MacOS/Qoder CN"]

[supported_versions]
denylist = []

[protocol]
kind = "acp"
version = "stable_v1"
framing = "json_rpc_stdio"

# Verified against 1.1.86-hotfix.19 on Windows (2026-11-26): streamed message
# and thought chunks, request_permission, session/cancel returning
# `cancelled` without reconnecting, session/list, session/load with history
# replay, and session/resume without replay.
[capability_expectations]
streaming_text = "native"
session_resume = "runtime_negotiated"
approvals = "native_request_permission"
cancellation = "native_cancel"
