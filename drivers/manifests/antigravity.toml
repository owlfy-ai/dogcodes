schema_version = 1
id = "antigravity"
display_name = "Antigravity"
homepage = "https://antigravity.google/"
runtime_kind = "external_process"

[discovery]
candidate_executables = ["agy"]
# `agy --version` prints a bare semver, so product identity comes from the
# local models help surface instead.
version_args = ["--version"]
# Query the command's local help, never the authenticated model list. A failed
# `models` lookup can open native login UI even with the headless flag set.
# The usage signature includes this CLI's name, subcommand and flag syntax.
identity_args = ["models", "--help"]
version_output_markers = ["Usage: agy models [flags]", "Usage: agy.exe models [flags]"]
env_allowlist = ["PATH"]
# Discovery runs before the driver's command preparation. Keep both help
# and `--version` noninteractive here too, including on a consoleless Windows host.
# The native updater can create a visible child console. Its opt-out requires
# the literal "true"; "1" does not disable updates.
env_overrides = { AGY_CLI_NONINTERACTIVE_HEADLESS = "1", AGY_CLI_DISABLE_AUTO_UPDATE = "true" }
# Retain the cold-start budget for native Windows launchers.
timeout_millis = 10000
output_limit_bytes = 65536

[discovery.platform_paths]
macos = []
windows = []
linux = []

[discovery.user_paths]
macos = [".local/bin/agy"]
windows = []
linux = [".local/bin/agy"]

[supported_versions]
denylist = []

[protocol]
kind = "antigravity_stream_json"
version = "v1_headless_beta"
framing = "ndjson_stdio"

[capability_expectations]
streaming_text = "native_via_step_update_beta"
session_resume = "native_verified_via_conversation_flag"
approvals = "no_interactive_surface_documented"
cancellation = "stdin_close_interrupt_beta"
