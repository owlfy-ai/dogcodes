schema_version = 1
id = "grok"
display_name = "Grok Build"
homepage = "https://grok.com/"
runtime_kind = "external_process"

[discovery]
candidate_executables = ["grok"]
version_args = ["--version"]
version_output_markers = ["grok"]
env_allowlist = ["PATH"]
timeout_millis = 3000
output_limit_bytes = 65536
# Pin the interactive approval policy. Grok 1.0.13 ACP otherwise inherits an
# account-level auto mode and can execute writes without requestPermission.
launch_args = ["agent", "stdio"]

[discovery.platform_paths]
macos = []
windows = []
linux = []

[discovery.user_paths]
macos = [".local/bin/grok", ".grok/bin/grok"]
windows = []
linux = [".local/bin/grok", ".grok/bin/grok"]

[supported_versions]
denylist = []

[protocol]
kind = "acp"
version = "stable_v1_beta"
framing = "json_rpc_stdio"

[capability_expectations]
streaming_text = "native_via_acp_beta"
session_resume = "acp_load_session_advertised_runtime_probe_pending"
approvals = "safe_decline_until_pending_interaction"
cancellation = "acp_session_cancel"
