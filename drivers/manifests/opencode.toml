schema_version = 1
id = "opencode"
display_name = "OpenCode"
homepage = "https://opencode.ai/"
runtime_kind = "external_process"

[discovery]
candidate_executables = ["opencode"]
version_args = ["--version"]
identity_args = ["--help"]
version_output_markers = ["opencode"]
env_allowlist = ["PATH", "HOME"]
timeout_millis = 5000
output_limit_bytes = 65536
launch_args = ["acp"]

[discovery.platform_paths]
macos = []
windows = []
linux = []

[discovery.user_paths]
macos = [".opencode/bin/opencode", ".local/bin/opencode"]
windows = ["AppData/Roaming/npm/opencode.cmd"]
linux = [".opencode/bin/opencode", ".local/bin/opencode"]

[supported_versions]
denylist = []

[protocol]
kind = "acp"
version = "stable_v1"
framing = "json_rpc_stdio"

[capability_expectations]
streaming_text = "native"
session_resume = "runtime_negotiated"
approvals = "native_request_permission"
cancellation = "native_cancel"
