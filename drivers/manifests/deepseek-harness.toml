schema_version = 1
id = "deepseek-harness"
display_name = "DeepSeek Harness"
homepage = "https://github.com/deepseek-ai/deepseek-harness"
runtime_kind = "external_process"

[discovery]
candidate_executables = ["dsh"]
version_args = ["--version"]
identity_args = ["--help"]
version_output_markers = ["dsh"]
env_allowlist = ["PATH", "HOME"]
timeout_millis = 5000
output_limit_bytes = 65536
launch_args = ["--profile", "acp"]

[discovery.platform_paths]
macos = []
windows = []
linux = []

[discovery.user_paths]
macos = [".local/bin/dsh", ".npm-global/bin/dsh"]
windows = ["AppData/Roaming/npm/dsh.cmd"]
linux = [".local/bin/dsh", ".npm-global/bin/dsh"]

[supported_versions]
denylist = []

[protocol]
kind = "acp"
version = "stable_v1"
framing = "json_rpc_stdio"

[capability_expectations]
streaming_text = "native"
session_resume = "runtime_negotiated"
approvals = "native_request_permission"
cancellation = "native_cancel"
