schema_version = 1
id = "zcode"
display_name = "ZCode"
homepage = "https://z.ai/"
runtime_kind = "external_process"

[discovery]
# The CLI ships inside the desktop app as a Node script; the app's own
# Electron binary runs it in node mode, so no system Node.js is required.
candidate_executables = ["ZCode"]
bundled_script = "glm/zcode.cjs"
version_args = ["--version"]
identity_args = ["doctor"]
version_output_markers = ["zcode-cli", "zcode doctor"]
env_allowlist = ["PATH"]
timeout_millis = 5000
output_limit_bytes = 65536

[discovery.env_overrides]
ELECTRON_RUN_AS_NODE = "1"

[discovery.platform_paths]
macos = ["/Applications/ZCode.app/Contents/MacOS/ZCode"]
windows = []
linux = []

[discovery.user_paths]
macos = ["Applications/ZCode.app/Contents/MacOS/ZCode"]

[supported_versions]
denylist = []

[protocol]
kind = "zcode_app_server"
version = "v1_beta"
framing = "jsonl_stdio"

[capability_expectations]
streaming_text = "native_via_app_server_beta"
session_resume = "native_cold_resume_verified_0.16.9"
approvals = "interaction_requestPermission_shape_unverified"
cancellation = "session_stop_beta"
