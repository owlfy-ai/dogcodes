[package]
name = "target-link"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { path = "../protocol" }
agent-runtime = { path = "../runtime" }
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
target-wire = { path = "../target-wire" }
tokio = { workspace = true, features = ["io-util", "net", "process", "time", "sync", "macros", "rt"] }
uuid.workspace = true

[dev-dependencies]
agent-core = { path = "../core" }
agent-store = { path = "../store" }
chrono.workspace = true
workspace-ops = { path = "../workspace-ops", features = ["core"] }
acp-driver = { path = "../acp-driver" }
antigravity-driver = { path = "../antigravity-driver" }
agent-domain = { path = "../domain" }
driver-api = { path = "../driver-api" }
futures.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "io-std", "net", "process", "time", "sync", "macros", "rt-multi-thread"] }

# It must be able to answer as the approval hook, which a test harness can't.
[[test]]
name = "agy_remote_approval"
harness = false

[lints]
workspace = true
