[package]
name = "dogcodes-remote-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xcap = "0.9.8"
enigo = { version = "0.6.1", default-features = false, features = ["x11rb", "wayland", "libei_tokio"] }
arboard = "3.6.1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
keepawake = "0.6.1"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
plist = "1.10"

# Windows/Linux use the source-built software fallback, without runtime downloads.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
openh264 = "0.9.9"
openh264-sys2 = "0.9.0"

# Exercise the same fallback on the macOS development host without changing its
# production ScreenCaptureKit/VideoToolbox path.
[dev-dependencies]
tempfile = "3.27.0"
openh264 = "0.9.9"
openh264-sys2 = "0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr", "xfixes"] }
pipewire = "0.10.1"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libc = "0.2"
zbus = { version = "5.15.1", default-features = false, features = ["tokio"] }
tokio = { workspace = true, features = ["net"] }
futures.workspace = true
uuid.workspace = true
reis = { version = "0.7.1", features = ["tokio"] }
xkbcommon = "0.9"
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }
gstreamer-video = { version = "0.25", features = ["v1_20"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The isolated synthetic source drives its own PipeWire clock; production capture
# continues to use the existing baseline API.
pipewire = { version = "0.10.1", features = ["v0_3_34"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
# ScreenCaptureKit capture + VideoToolbox H.264 (the video path).
objc2 = "0.6.4"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_Foundation", "Win32_Devices_Display", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# The Windows session-state query is isolated here; business crates forbid unsafe code.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
