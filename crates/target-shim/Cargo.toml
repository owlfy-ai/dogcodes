[package]
name = "target-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dogcodes-shim"
path = "src/main.rs"

[dependencies]
agent-management = { path = "../agent-management" }
hex.workspace = true
process-scope = { path = "../process-scope" }
sha2.workspace = true
serde_json.workspace = true
target-wire = { path = "../target-wire" }
workspace-ops = { path = "../workspace-ops" }
tokio = { workspace = true, features = ["net", "io-std", "io-util", "rt", "rt-multi-thread", "macros", "time", "process", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["user", "hostname", "signal", "process"] }
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
