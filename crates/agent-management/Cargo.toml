[package]
name = "agent-management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# This machine's HTTP client, for the desktop. The shim stays free of a TLS stack and
# asks the server's own `curl`, which also respects how that server reaches the network.
native-http = ["dep:reqwest"]
# Fixtures other crates' tests build installations from.
test-support = []

[dependencies]
agent-protocol = { path = "../protocol" }
agent-registry = { path = "../agent-registry" }
agent-runtime = { path = "../runtime", default-features = false }
plist = "1.10"
chrono.workspace = true
futures.workspace = true
hex.workspace = true
quick-xml = { version = "0.41", features = ["serialize"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"], optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "time"] }
url = "2.5.8"

[dev-dependencies]
agent-domain = { path = "../domain" }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "time"] }

[lints]
workspace = true
