[package]
name = "dogcodes-endpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["ffi"]
ffi = []

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
tempfile = "3"
