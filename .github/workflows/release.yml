name: Draft release

# Pushing a tag such as v0.1.0 builds unsigned installers on each platform and
# creates a *draft* GitHub Release with checksums. A maintainer reviews the draft
# and publishes it manually; nothing is published automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag must match every published version field
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json")).version,
              "apps/desktop/package.json": JSON.parse(fs.readFileSync("apps/desktop/package.json")).version,
              "tauri.conf.json": JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")).version,
              "Cargo.toml": (fs.readFileSync("Cargo.toml", "utf8").match(/\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/) || [])[1],
            };
            const wrong = Object.entries(versions).filter(([, v]) => v !== tag);
            if (wrong.length) { console.error(`Tag ${tag} does not match:`, wrong); process.exit(1); }
          '

  installers:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Select GStreamer's libunwind provider explicitly so APT replaces the
          # conflicting LLVM libunwind development package on hosted runners.
          sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev file patchelf xdg-utils libssl-dev build-essential pkg-config nasm libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libpipewire-0.3-modules libspa-0.2-modules pipewire-bin wireplumber dbus libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev
      - name: Compatible SPA build headers for the Linux baseline
        if: runner.os == 'Linux'
        run: python3 scripts/prepare_linux_spa_sdk.py --destination "${{ runner.temp }}/dogcodes-native-sdk" --github-env "$GITHUB_ENV"
      - name: Install the repository Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - run: pnpm check
      - run: cargo test --workspace --lib --tests --locked
        env:
          RUST_MIN_STACK: '16777216'
      - name: Build unsigned installer
        run: pnpm desktop:package --unsigned --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Release AppImage client on a private Portal
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          RUST_MIN_STACK: '16777216'
        run: python3 scripts/wayland_acceptance.py --release --format rgb-cursor --appimage target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  draft:
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "release-assets/$name" ]; then
              echo "Duplicate installer filename: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find installers -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "$(find release-assets -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum -- *.exe *.dmg *.deb *.AppImage > SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Desktop release candidate. Review installation results and known limitations
          before publishing. The local `pnpm desktop:release` command replaces the
          Mac and Windows CI packages and refreshes checksums automatically.

          <!-- dogcodes-signing:start -->
          | Platform | Package status |
          | --- | --- |
          | macOS ARM64 / Intel | Awaiting local signed packages |
          | Windows x64 | Awaiting local signed package |
          | Linux x64 | CI-built DEB / AppImage; no additional package signature |
          <!-- dogcodes-signing:end -->
          NOTES
          gh release create "$TAG" --repo "$REPO" --draft --prerelease \
            --title "dog.codes $TAG" --notes-file notes.md release-assets/*
