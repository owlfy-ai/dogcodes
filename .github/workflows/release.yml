name: Draft release

# Pushing a tag such as v0.1.0 builds unsigned installers on each platform and
# creates a *draft* GitHub Release with checksums. A maintainer reviews the draft
# and publishes it manually; nothing is published automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag must match every published version field
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json")).version,
              "apps/desktop/package.json": JSON.parse(fs.readFileSync("apps/desktop/package.json")).version,
              "tauri.conf.json": JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")).version,
              "Cargo.toml": (fs.readFileSync("Cargo.toml", "utf8").match(/\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/) || [])[1],
            };
            const wrong = Object.entries(versions).filter(([, v]) => v !== tag);
            if (wrong.length) { console.error(`Tag ${tag} does not match:`, wrong); process.exit(1); }
          '

  installers:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev build-essential
      - name: Install the repository Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - run: pnpm check
      - run: cargo test --workspace --lib --tests --locked
        env:
          RUST_MIN_STACK: '16777216'
      - name: Build unsigned installer
        run: pnpm desktop:package --unsigned --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  draft:
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Development preview. These installers are **unsigned**: macOS Gatekeeper and
          Windows SmartScreen will warn before opening them. Verify each download against
          `SHA256SUMS.txt`. See the README for supported agents and known limitations.
          NOTES
          gh release create "$TAG" --repo "$REPO" --draft --prerelease \
            --title "dog.codes $TAG" --notes-file notes.md installers/*
