name: Draft release

# Pushing a tag such as v0.1.0 builds unsigned installers on each platform and
# creates a *draft* GitHub Release with checksums. A maintainer reviews the draft
# and publishes it manually; nothing is published automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag must match the Cargo workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const version = (fs.readFileSync("Cargo.toml", "utf8").match(/\[workspace\.package\][^\[]*?\nversion\s*=\s*"([^"]+)"/) || [])[1];
            if (version !== tag) { console.error(`Tag ${tag} does not match Cargo.toml version ${version}`); process.exit(1); }
          '

  installers:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      full: true

  draft:
    needs: installers
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dogcodes-unsigned-*
          path: installers
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          # Linux DEB/AppImage are omitted until real-machine testing. Restore with:
          # -o -name '*.deb' -o -name '*.AppImage'
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "release-assets/$name" ]; then
              echo "Duplicate installer filename: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find installers -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          test "$(find release-assets -type f | wc -l)" -eq 3
          cd release-assets
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          # sha256sum -- *.exe *.dmg *.deb *.AppImage > SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Desktop release candidate. Review installation results and known limitations
          before publishing. The local `pnpm desktop:release` command replaces the
          Mac and Windows CI packages and refreshes checksums automatically.

          <!-- dogcodes-signing:start -->
          | Platform | Package status |
          | --- | --- |
          | macOS ARM64 / Intel | Awaiting local signed packages |
          | Windows x64 | Awaiting local signed package |
          <!-- Linux packaging paused until real-machine testing
          | Linux x64 | CI-built DEB / AppImage; no additional package signature |
          | Linux ARM64 | CI-built DEB / AppImage; no additional package signature |
          -->
          <!-- dogcodes-signing:end -->
          NOTES
          gh release create "$TAG" --repo "$REPO" --draft --prerelease \
            --title "dog.codes $TAG" --notes-file notes.md release-assets/*
