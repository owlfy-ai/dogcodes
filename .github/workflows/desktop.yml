name: Desktop checks and unsigned packages

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run all build checks and unsigned packaging (tests run locally).
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Determine affected checks
        id: scope
        env:
          FULL_CHECKS: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-changes.mjs
      - run: node scripts/check-release-inputs.mjs

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  desktop:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          # Linux desktop CI is paused until a real machine has been tested.
          # Restore these rows together with the package steps below.
          # - os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   bundles: deb,appimage
          # - os: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
          #   bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Select GStreamer's libunwind provider explicitly so APT replaces the
          # conflicting LLVM libunwind development package on hosted runners.
          sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev file patchelf xdg-utils libssl-dev build-essential pkg-config nasm libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libpipewire-0.3-modules libspa-0.2-modules libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad libwayland-dev libegl-dev libgbm-dev libegl-mesa0 libgl1-mesa-dri libxkbcommon-dev coturn xvfb x11-utils x11-xserver-utils pipewire-bin wireplumber dbus-x11
      - name: Compatible SPA build headers for the Linux baseline
        if: runner.os == 'Linux'
        run: |
          python3 scripts/prepare_linux_spa_sdk.py --destination "${{ runner.temp }}/dogcodes-native-sdk" --github-env "$GITHUB_ENV"
      - name: Install the repository Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          cache-on-failure: true
      # Check formatting once while the Linux runner is paused.
      - run: cargo fmt --all -- --check
        if: matrix.target == 'aarch64-apple-darwin'
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      # Linux DEB/AppImage packaging is paused until real-machine install testing.
      - name: Build unsigned installer
        if: runner.os != 'Linux' && (inputs.full || github.event_name == 'workflow_dispatch')
        run: pnpm desktop:package --unsigned --skip-tests --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Retain only installer artifacts for validation
        if: runner.os != 'Linux' && (inputs.full || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: dogcodes-unsigned-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          # Linux packages stay out of the draft until real-machine testing:
          # target/${{ matrix.target }}/release/bundle/deb/*.deb
          # target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # One stable required check also completes for documentation-only changes.
  checks:
    if: always()
    needs: [changes, frontend, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify all selected checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          NATIVE_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_REQUIRED" = true ]; then test "$FRONTEND_RESULT" = success; fi
          if [ "$NATIVE_REQUIRED" = true ]; then test "$NATIVE_RESULT" = success; fi
