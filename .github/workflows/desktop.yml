name: Desktop checks and unsigned packages

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm check:release-inputs
      - run: pnpm check
      - name: ZCode native account and credential bridge tests
        shell: bash
        run: node --test crates/zcode-driver/src/*.test.cjs

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.0.9
      - run: pnpm install --frozen-lockfile
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev file patchelf xdg-utils libssl-dev build-essential pkg-config nasm libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libpipewire-0.3-modules libspa-0.2-modules libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad libwayland-dev libegl-dev libgbm-dev libegl-mesa0 libgl1-mesa-dri libxkbcommon-dev coturn xvfb x11-utils x11-xserver-utils pipewire-bin wireplumber dbus-x11
      - name: Compatible SPA build headers for the Linux baseline
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts -p test_prepare_linux_spa_sdk.py -v
          python3 scripts/prepare_linux_spa_sdk.py --destination "${{ runner.temp }}/dogcodes-native-sdk" --github-env "$GITHUB_ENV"
      - name: Install the repository Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - name: Relay video QoS on deterministic capacity and ACK traces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustfmt --edition 2024 --check scripts/relay_qos_trace.rs
          rustc --edition=2024 -D warnings --test scripts/relay_qos_trace.rs -o "$RUNNER_TEMP/dogcodes-relay-qos-tests"
          "$RUNNER_TEMP/dogcodes-relay-qos-tests"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native unit and integration tests (real-provider tests remain opt-in)
        timeout-minutes: 30
        shell: bash
        env:
          # Large debug async state machines exceed the Windows test-thread
          # stack; this changes the harness resources, not which tests run.
          RUST_MIN_STACK: '16777216'
        run: cargo test --workspace --lib --tests --locked --no-fail-fast 2>&1 | tee native-tests.log
      - name: Software video capture on an isolated X11 display
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp -ac -noreset > /tmp/dogcodes-video-xvfb.log 2>&1 &
          video_xvfb_pid=$!
          trap 'kill "$video_xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 XDG_SESSION_TYPE=x11
          export DOGCODES_OWNED_XVFB=video-fallback-fixture-v1
          for attempt in $(seq 1 30); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          cargo test -p dogcodes-remote-desktop --locked isolated_x11_capture -- --ignored --nocapture
      - name: Linux encoding pipeline with synthetic software elements
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DOGCODES_LINUX_ENCODER_FIXTURE: synthetic-only
        run: cargo test -p dogcodes-remote-desktop --lib --locked synthetic_pipeline_verifies_headers_forced_idr_pts_rate_and_rejection -- --ignored --nocapture
      - name: Wayland portal fixture and real PipeWire software video
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python3 scripts/wayland_acceptance.py
          python3 scripts/wayland_acceptance.py --format rgb-cursor
          python3 scripts/wayland_acceptance.py --format nv12-default
          python3 scripts/wayland_acceptance.py --format nv12-bt601
          python3 scripts/wayland_acceptance.py --format nv12-bt709
          python3 scripts/wayland_acceptance.py --format nv12-bt709-planes
          python3 scripts/wayland_acceptance.py --format rgb-crop-rotate90
          python3 scripts/wayland_acceptance.py --format rgb-crop-flipped90
      - name: Offscreen EGL external images and shared display lifetime
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DOGCODES_OWNED_EGL: offscreen-only
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: cargo test -p dogcodes-remote-desktop --locked owned_egl_renderer -- --ignored --nocapture
      - name: Desktop video migration, geometry and backpressure on a private login1 bus
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/desktop_codec_acceptance.py
      - name: TURN data/video, UDP/TCP/TLS and certificate validation
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/turn_acceptance.py
      - name: Retain failed native test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-log-${{ matrix.target }}
          path: native-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build unsigned installer
        run: pnpm desktop:package --unsigned --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Packaged PipeWire client on a private Portal
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/wayland_acceptance.py --format rgb-cursor --appimage target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - name: Retain only installer artifacts for validation
        uses: actions/upload-artifact@v7
        with:
          name: dogcodes-unsigned-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
