[workspace]
resolver = "2"
members = [
  "crates/remote-endpoint",
  "crates/domain",
  "crates/protocol",
  "crates/driver-api",
  "crates/codex-driver",
  "crates/acp-driver",
  "crates/claude-driver",
  "crates/pi-driver",
  "crates/antigravity-driver",
  "crates/zcode-driver",
  "crates/core",
  "crates/store",
  "crates/runtime",
  "crates/agent-registry",
  "crates/redaction",
  "crates/workspace",
  "crates/native-acl",
  "crates/open-with",
  "experiments/codex-app-server",
  "experiments/acp",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1.89"
agent-client-protocol = { version = "2.1.0", default-features = false }
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
hex = "0.4.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
regex = "1.13.1"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
toml = "0.9.7"
ulid = { version = "1.2.1", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
# Tauri commands and daemon handlers hold large async state machines by design;
# boxing each future adds churn without benefit. Other pedantic lints stay on.
large_futures = "allow"
