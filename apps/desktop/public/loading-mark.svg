<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <style>
    /* Double-suspension gallop: jointed legs, a flexing spine and a body that pitches between strides. */
    .dog { transform-origin: 48px 30px; animation: body 0.58s linear infinite; }
    .front-half { transform-origin: 47px 22px; animation: front-half 0.58s linear infinite; }
    .rear-half { transform-origin: 47px 22px; animation: rear-half 0.58s linear infinite; }
    .head { transform-origin: 70px 19px; animation: head 0.58s linear infinite; }
    .tail { transform-origin: 26px 18px; animation: tail 0.58s linear infinite; }
    .ear { transform-origin: 79.5px 6px; animation: ear 0.29s ease-in-out infinite alternate; }
    .tongue { transform-origin: 88px 16.8px; animation: tongue 0.29s ease-in-out infinite alternate; }
    .u-front { animation: front-upper 0.58s linear infinite; }
    .l-front { animation: front-lower 0.58s linear infinite; }
    .u-hind { animation: hind-upper 0.58s linear infinite; }
    .l-hind { animation: hind-lower 0.58s linear infinite; }
    .far { animation-delay: -0.045s; }
    .shadow { transform-origin: 48px 56.5px; animation: shadow 0.58s linear infinite; }
    .ground { animation: ground 0.58s linear infinite; }
    .dust { animation: dust 1.16s ease-out infinite; opacity: 0; }
    .dust.b { animation-delay: -0.58s; }
    @keyframes front-upper { 0% { transform: rotate(-55deg); } 14% { transform: rotate(-32deg); } 28% { transform: rotate(4deg); } 40% { transform: rotate(34deg); } 52% { transform: rotate(32deg); } 66% { transform: rotate(2deg); } 80% { transform: rotate(-30deg); } 90% { transform: rotate(-50deg); } 100% { transform: rotate(-55deg); } }
    @keyframes front-lower { 0% { transform: rotate(-8deg); } 14% { transform: rotate(0deg); } 28% { transform: rotate(0deg); } 40% { transform: rotate(22deg); } 52% { transform: rotate(100deg); } 66% { transform: rotate(112deg); } 80% { transform: rotate(82deg); } 90% { transform: rotate(22deg); } 100% { transform: rotate(-8deg); } }
    @keyframes hind-upper { 0% { transform: rotate(58deg); } 12% { transform: rotate(44deg); } 26% { transform: rotate(14deg); } 40% { transform: rotate(-24deg); } 52% { transform: rotate(-44deg); } 64% { transform: rotate(-34deg); } 76% { transform: rotate(0deg); } 88% { transform: rotate(34deg); } 100% { transform: rotate(58deg); } }
    @keyframes hind-lower { 0% { transform: rotate(18deg); } 12% { transform: rotate(-48deg); } 26% { transform: rotate(-96deg); } 40% { transform: rotate(-82deg); } 52% { transform: rotate(-36deg); } 64% { transform: rotate(-10deg); } 76% { transform: rotate(-14deg); } 88% { transform: rotate(2deg); } 100% { transform: rotate(18deg); } }
    @keyframes body { 0% { transform: translateY(-3px) rotate(-2deg); } 14% { transform: translateY(-1px) rotate(2deg); } 28% { transform: translateY(1.5px) rotate(4deg); } 45% { transform: translateY(-1px) rotate(1deg); } 52% { transform: translateY(-3.5px) rotate(0deg); } 66% { transform: translateY(-1.5px) rotate(-3deg); } 78% { transform: translateY(1.5px) rotate(-4deg); } 90% { transform: translateY(-1px) rotate(-3deg); } 100% { transform: translateY(-3px) rotate(-2deg); } }
    @keyframes front-half { 0% { transform: rotate(-3deg); } 28% { transform: rotate(2deg); } 52% { transform: rotate(5deg); } 78% { transform: rotate(0deg); } 100% { transform: rotate(-3deg); } }
    @keyframes rear-half { 0% { transform: rotate(4deg); } 28% { transform: rotate(2deg); } 52% { transform: rotate(-6deg); } 78% { transform: rotate(-2deg); } 100% { transform: rotate(4deg); } }
    @keyframes head { 0% { transform: rotate(-3deg); } 28% { transform: rotate(5deg); } 52% { transform: rotate(0deg); } 78% { transform: rotate(-5deg); } 100% { transform: rotate(-3deg); } }
    @keyframes tail { 0% { transform: rotate(-4deg); } 28% { transform: rotate(7deg); } 52% { transform: rotate(11deg); } 78% { transform: rotate(-7deg); } 100% { transform: rotate(-4deg); } }
    @keyframes shadow { 0% { transform: scale(0.82, 0.82); } 28% { transform: scale(1, 1); } 52% { transform: scale(0.78, 0.78); } 78% { transform: scale(1, 1); } 100% { transform: scale(0.82, 0.82); } }
    @keyframes ear { from { transform: rotate(-6deg); } to { transform: rotate(9deg); } }
    @keyframes tongue { from { transform: rotate(-6deg); } to { transform: rotate(12deg); } }
    @keyframes ground { to { stroke-dashoffset: 28; } }
    @keyframes dust { 0%, 40% { opacity: 0; transform: translate(0, 0) scale(.3); } 46% { opacity: .65; transform: translate(0, 0) scale(.45); } 100% { opacity: 0; transform: translate(-16px, -6px) scale(1.5); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="coat" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="40">
      <stop offset="0" stop-color="#4A5561"/><stop offset=".45" stop-color="#2D343C"/><stop offset="1" stop-color="#1F242A"/>
    </linearGradient>
    <linearGradient id="white" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="56">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE1DB"/>
    </linearGradient>
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.45" result="grown"/>
      <feFlood flood-color="#5D6873" flood-opacity=".6"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path class="ground" d="M8 70.6H88" stroke="#A9CB72" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="10 4"/>
  <g transform="translate(9 25.8) scale(.8)">
    <ellipse class="shadow" cx="48" cy="56.6" rx="30" ry="2.2" fill="#2B323A" fill-opacity=".16"/>
  </g>
  <g transform="translate(22 66)"><circle class="dust" r="2.4" fill="#A9CB72" fill-opacity=".5"/><circle class="dust b" cx="4" cy="1" r="1.8" fill="#A9CB72" fill-opacity=".5"/></g>
  <g transform="translate(9 25.8) scale(.8)" filter="url(#outline)">
