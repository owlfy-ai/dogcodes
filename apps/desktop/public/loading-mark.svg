      </g></g></g>
        <g class="tail">
          <path d="M28 16.4C22 14.6 15 14.6 9.6 16.8C6.4 18 3.6 19.8 1.4 21.6C2.6 22.2 3.8 22.4 5 22.2C3.8 23.4 3 24.6 2.4 26C3.8 25.8 5.2 25.4 6.6 24.8C6 26 5.6 27.2 5.4 28.4C8.6 26.6 11.4 25 14.4 23.8C18.6 22.2 23 21.6 28 21.8Z" fill="url(#coat)"/>
