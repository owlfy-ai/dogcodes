        </g>
        <path d="M51 14.2C43 13.6 34 13.2 27 15.4C21 17.4 17.6 23 19.2 29C20.6 34 26.4 36.6 32.4 35.6C37 34.8 40.6 32.2 44.6 30.6C46.8 29.8 49 29.6 51 29.8Z" fill="url(#coat)"/>
      </g>
      <g class="front-half">
        <g class="leg-front-far" transform="translate(-3.2 -.6)"><g class="u-front far" style="transform-origin:64px 29px">
      <path d="M60.4 25.5C60 31 60.8 36 62.4 41.2L66.6 41.2C67.6 36 68.2 30.8 67.8 25.5Z" fill="#1B2026"/>
      <g class="l-front far" style="transform-origin:64.5px 40.5px">
        <path d="M62.7 40.2C62.6 44 62.8 48 63.2 52.2L66.4 52.2C66.4 48 66.5 44 66.5 40.2Z" fill="#1B2026"/><path d="M63 48.6C63.1 50 63.2 51.2 63.3 52.4L66.4 52.4C66.4 51.2 66.4 50 66.4 48.6Z" fill="#BFC4C6"/><path d="M62.9 51.8C62.6 53.9 63.6 55.6 65.6 55.8C67 55.9 68.4 55.7 68.8 55C69 54.2 68.2 53.3 66.5 52.7Z" fill="#BFC4C6"/><path d="M66.4 54.2 67.3 55.6" stroke="#9AA2A6" stroke-width=".45" stroke-linecap="round"/>
      </g></g></g>
        <path d="M42 13.6C49 13.6 55 12.6 60.6 12.8C66 13 70.4 16.4 72.4 22C74 26.6 73.2 31.6 69.8 35C66.6 38.2 60.8 39.4 55.6 38.4C51 37.6 47.4 34.6 44.4 31.2C43.4 30.6 42.6 30.6 42 30.6Z" fill="url(#coat)"/>
        <path d="M59.6 14C63.8 9.6 69.8 6.4 75.8 6L80 12.6C77.4 16 75 20.6 73 26L66 27.6C63.4 23 61 18.6 59.6 14Z" fill="url(#coat)"/>
        <path d="M69.6 12.2C72.6 13.2 75.6 15 77.8 17.6C76.6 18.6 76.8 19.6 75.8 20.6C75.4 21.8 75.6 22.8 74.6 23.8C74.4 25.2 74.6 26.4 73.6 27.4C73.6 29 73.4 30.6 72.4 31.8C71.8 34 70.6 36 68.8 37.6C68 38.4 66.8 38.6 66 38.2C65.2 35 65.6 31 66.4 27.4C67 23.4 67.8 19.6 68.6 16C68.9 14.6 69.2 13.4 69.6 12.2Z" fill="url(#white)"/>
        <g class="head">
          <path class="ear" d="M76.6 7.2C76.4 3.6 77.6 .4 79.8 -1.4C81.6 -.4 82.6 2.4 82.4 6Z" fill="#232930"/>
          <path d="M74 9C75 5 79.6 3.2 84 5.4C86 6.4 87.6 8.4 89 9.8C92 10.6 95 11.4 96.2 13C96.6 14.6 95.4 15.8 93.6 16C90.6 16.4 87.6 16.8 85 17.4C81 18.2 77 17 75 14.4C73.8 12.8 73.6 10.8 74 9Z" fill="url(#coat)"/>
          <path d="M86.2 9.8C89 10.6 92.4 11.4 95.4 12.6C96.4 14.2 95.4 15.8 93.6 16C90.6 16.4 87.6 16.8 85 17.4C84.2 15 84.6 12 86.2 9.8ZM81.2 4.4C82.6 5.4 84.2 7.6 86.4 9.8L85.4 11C83.4 8.8 81.8 6.6 81.2 4.4Z" fill="url(#white)"/>
          <path class="tongue" d="M87.6 16.4C87.6 18.6 88.6 20.6 90.4 20.6C92 20.6 92.4 19 91.8 17.6C91.4 16.8 90.8 16.4 90 16.2Z" fill="#E98A92"/>
          <path d="M86.4 16.6C88.6 16.2 91 15.9 93 15.7" stroke="#1A1F24" stroke-width=".55" stroke-linecap="round"/>
          <ellipse cx="95.6" cy="13.3" rx="1.35" ry="1.1" fill="#14181C"/>
          <ellipse cx="83.4" cy="8.6" rx="1.25" ry="1" fill="#0F1215"/><circle cx="83.7" cy="8.2" r=".38" fill="#FFF"/>
        </g>
        <g class="leg-front-near"><g class="u-front near" style="transform-origin:64px 29px">
      <path d="M60.4 25.5C60 31 60.8 36 62.4 41.2L66.6 41.2C67.6 36 68.2 30.8 67.8 25.5Z" fill="url(#coat)"/><path d="M61.4 27.6C60.9 31.6 61.4 35.8 62.7 40" stroke="#56616C" stroke-width=".7" stroke-linecap="round"/>
      <g class="l-front near" style="transform-origin:64.5px 40.5px">
        <path d="M62.7 40.2C62.6 44 62.8 48 63.2 52.2L66.4 52.2C66.4 48 66.5 44 66.5 40.2Z" fill="url(#coat)"/><path d="M63 48.6C63.1 50 63.2 51.2 63.3 52.4L66.4 52.4C66.4 51.2 66.4 50 66.4 48.6Z" fill="url(#white)"/><path d="M62.9 51.8C62.6 53.9 63.6 55.6 65.6 55.8C67 55.9 68.4 55.7 68.8 55C69 54.2 68.2 53.3 66.5 52.7Z" fill="url(#white)"/><path d="M66.4 54.2 67.3 55.6" stroke="#9AA2A6" stroke-width=".45" stroke-linecap="round"/>
      </g></g></g>
      </g>
      <!-- Drawn last so it stays in front when it reaches under the chest; it shares the rear half's flex. -->
      <g class="rear-half">
        <g class="leg-hind-near"><g class="u-hind near" style="transform-origin:31px 27px">
      <path d="M25.6 21.5C24.6 27.5 26.2 33 28.8 38C30 40.6 30.9 42.4 31.4 43.6L35.4 43.6C35.8 40.2 36.3 36 37.2 31C37.9 27 37.2 23.4 35 20.6Z" fill="url(#coat)"/><path d="M35.8 21.8C37.8 25.6 37.6 30 36.2 34.4" stroke="#56616C" stroke-width=".7" stroke-linecap="round"/>
      <g class="l-hind near" style="transform-origin:33.4px 43px">
        <path d="M31.5 42.6C31.9 46.4 32.3 50 32.6 53.2L35.6 53.2C35.4 49.8 35.3 46.2 35.3 42.6Z" fill="url(#coat)"/><path d="M32.2 49.4C32.4 50.8 32.5 52 32.6 53.4L35.6 53.4C35.5 52 35.5 50.8 35.4 49.4Z" fill="url(#white)"/><path d="M32.2 52.8C31.9 54.9 32.9 55.8 34.8 55.9C36.2 56 37.6 55.7 38 55C38.2 54.2 37.4 53.4 35.7 53Z" fill="url(#white)"/><path d="M35.6 54.4 36.5 55.7" stroke="#9AA2A6" stroke-width=".45" stroke-linecap="round"/>
