# Only the native client protocol and capture nodes are needed. The desktop
# connects with the FD granted by the portal; this does not start a server.
context.spa-libs = {
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
]
